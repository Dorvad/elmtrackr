org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# R8 full mode: stronger optimization, obfuscation, and dead-code removal than
# compatibility mode. This is the AGP 8+ default; pinned here so a future
# toolchain change cannot silently regress release builds to compat mode.
android.enableR8.fullMode=true
# Optimized (precise) resource shrinking is always enabled as of AGP 9; the
# old preciseShrinking property was removed.
# Keep using the standalone Kotlin Android plugin (KGP) instead of AGP 9's
# built-in Kotlin: KSP, Hilt, kotlinx-serialization, and Paparazzi still hook
# into KGP. Migrate to built-in Kotlin (and drop both properties) once those
# plugins support it; AGP 10 removes this bridge.
android.builtInKotlin=false
android.newDsl=false
# Left off: the AGP compatibility bridge below (android.newDsl=false) is the most
# likely thing to break under configuration caching, and a broken cache is a
# confusing failure rather than a slow build. Revisit when the bridge is dropped.
org.gradle.configuration-cache=false
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Deliberately off, and NOT leftover debugging state — a July review guessed it was.
# Incremental compilation writes a class file per test method, and several test names
# contain non-ASCII characters (e.g. `valid input → Completed state`). Where the JVM's
# default charset cannot encode them, the compiler fails with
# InvalidPathException: Malformed input or input contains unmappable characters.
# Verified by enabling both and watching :app:compileDebugUnitTestKotlin fail.
# Re-enabling needs the test names renamed, or a guaranteed UTF-8 file.encoding
# everywhere the project is built.
ksp.incremental=false
kotlin.incremental=false
