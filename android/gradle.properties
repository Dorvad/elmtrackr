org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# R8 full mode: stronger optimization, obfuscation, and dead-code removal than
# compatibility mode. This is the AGP 8+ default; pinned here so a future
# toolchain change cannot silently regress release builds to compat mode.
android.enableR8.fullMode=true
org.gradle.configuration-cache=false
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
ksp.incremental=false
kotlin.incremental=false
