# Builds debug + release artifacts from android/ and uploads them as downloadable artifacts.
# Supabase credentials are read from SUPABASE_URL / SUPABASE_ANON_KEY repo secrets
# (optional — build succeeds without them, app shows "Auth not configured").
# Release signing uses a CI-only keystore generated per run (not for Play Store upload).
# No emulator. No Play Store publishing.
# Triggered only when Android sources or this workflow file change.

name: Android CI

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  # Allow triggering a build manually from the Actions tab without a code push.
  workflow_dispatch:

jobs:
  build:
    name: Build & test debug APK
    runs-on: ubuntu-latest
    # Without a cap a hung Gradle task or a stalled dependency download holds a
    # runner for the account-wide six-hour default before anyone is told the job
    # is stuck. These are sized well above the observed run times, so they fire
    # only on a genuine hang.
    timeout-minutes: 45

    env:
      # Suppress the Gradle daemon in CI — each run is a fresh container.
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java ──────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # 21, not 17, and this is about the JVM Gradle runs on rather than what
          # the app compiles to. The Paparazzi 2.0.0-alpha05 Gradle plugin
          # publishes only a JVM 21 variant, so on 17 the build failed while
          # resolving the plugin classpath — before compiling a line — with
          # "Dependency requires at least JVM runtime version 21". Every run since
          # 2026-07-28 failed that way, on Main as well as on branches.
          #
          # The compiled output is unchanged: sourceCompatibility,
          # targetCompatibility and jvmTarget are all still 17, so the bytecode
          # and the minSdk 26 desugaring behaviour are exactly as before.
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.gradle/caches and ~/.gradle/wrapper keyed on
          # gradle-wrapper.properties + *.gradle.kts fingerprints.
          cache: gradle

      # ── Android SDK ───────────────────────────────────────────────────────
      # GitHub-hosted ubuntu-latest ships with the Android command-line tools
      # at $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.
      # We just need to accept licences and pull down platform-36.
      - name: Accept Android SDK licences & install platform 36
        run: |
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          "$SDK_MGR" "platforms;android-36" "build-tools;36.0.0"

      # ── Supabase credentials ─────────────────────────────────────────────
      # If SUPABASE_URL and SUPABASE_ANON_KEY are configured as repo secrets
      # the built APK will connect to Supabase. For fork pull requests and
      # repos without secrets the step is a no-op; the app still builds and
      # shows "Auth not configured" at runtime (expected CI behaviour).
      - name: Write Supabase credentials to local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'supabase.url=%s\nsupabase.anon.key=%s\n' \
              "$SUPABASE_URL" "$SUPABASE_ANON_KEY" \
              > android/local.properties
            echo "local.properties written — APK will connect to Supabase."
          else
            echo "Supabase secrets not set — APK will show 'Auth not configured'."
          fi

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # ── Tests ─────────────────────────────────────────────────────────────
      # Whole-build, not :app — this is what runs the :wear and :wear-sync
      # test sources as well.
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      # The 31 golden images under app/src/test/snapshots/images/ were committed
      # but nothing checked them: `testDebugUnitTest` runs the Paparazzi test
      # bodies without comparing their output. Any visual regression could land
      # unnoticed.
      #
      # continue-on-error, and this is not provisional: the committed goldens
      # were measured to be host-specific. Running verifyPaparazziDebug against
      # an *unmodified* checkout of Main on a different Linux machine failed all
      # 31 of them, while the rendered output was visually correct — Paparazzi
      # goes through layoutlib, and text rasterisation differs by host JDK and
      # font stack.
      #
      # So this step is only meaningful once the goldens are recorded on the
      # same image CI runs. Do NOT make it blocking before then, and do not
      # re-record on a developer machine to make it pass: that just moves the
      # failure to everyone else. The uploaded diffs are still useful as an
      # advisory signal in the meantime.
      - name: Verify Paparazzi goldens
        working-directory: android
        continue-on-error: true
        run: ./gradlew :app:verifyPaparazziDebug --no-daemon

      - name: Upload Paparazzi diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-failures
          path: android/app/build/paparazzi/failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Android lint (debug)
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon

      # ── Watch app ─────────────────────────────────────────────────────────
      # The watch artifact is a separate upload to the same Play listing, and
      # until August 2026 nothing in CI compiled it. The release build type is
      # the one that matters: :wear minifies with R8 full mode and shrinks
      # resources, so a missing keep rule or a stripped resource is invisible in
      # a debug build and only shows up on a reviewer's wrist. Play rejected
      # versionCode 10041 with "does not install or launch without crashing"
      # against exactly that blind spot.
      #
      # -PallowDebugSignedRelease=true because the upload keystore is not on CI.
      # The signature is not what is being tested here; R8, the resource
      # shrinker and the manifest merge are.
      - name: Assemble wear release APK (R8 + resource shrinking)
        working-directory: android
        run: >-
          ./gradlew :wear:assembleRelease --no-daemon --stacktrace
          -PallowDebugSignedRelease=true

      # Advisory, deliberately. assembleRelease above already runs
      # lintVitalRelease — the fatal-severity subset — and that step IS
      # blocking. The full release lint has never been run against :wear, so
      # making it blocking now would fail CI on a backlog of pre-existing
      # findings that have nothing to do with the change under review. Read the
      # uploaded report, work the backlog down, then drop continue-on-error.
      - name: Run Android lint on the wear release (advisory)
        working-directory: android
        continue-on-error: true
        run: ./gradlew :wear:lintRelease --no-daemon

      - name: Upload wear lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-lint-report
          path: |
            android/wear/build/reports/lint-results-release.html
            android/wear/build/reports/lint-results-release.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload wear release APK
        uses: actions/upload-artifact@v4
        with:
          # Verification build, debug-signed — install it on a Wear OS emulator
          # to reproduce a store-review crash. NOT uploadable to Play.
          name: ElmTrackr-wear-release-unsigned
          path: android/wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify Gradle wrapper
        working-directory: android
        run: ./gradlew wrapper --gradle-version $(sed -n 's/.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties) --dry-run

      # ── Artifact ──────────────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          # Download this from: Actions tab → select run → Artifacts section
          name: ElmTrackr-debug
          path: android/app/build/outputs/apk/debug/*.apk
          # Fail loudly if the APK was never produced.
          if-no-files-found: error
          retention-days: 30

  instrumented:
    name: Room migration & DAO tests (API 30)
    runs-on: ubuntu-latest
    needs: build
    # Higher than the others: this one boots an emulator, and an emulator that
    # fails to come up hangs rather than exiting.
    timeout-minutes: 60

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hardware acceleration for the emulator. Without KVM the emulator runs
      # in software, boots in 6-8 minutes, and the Android system server dies
      # during the runner's post-boot setup before any test executes.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # 21, not 17, and this is about the JVM Gradle runs on rather than what
          # the app compiles to. The Paparazzi 2.0.0-alpha05 Gradle plugin
          # publishes only a JVM 21 variant, so on 17 the build failed while
          # resolving the plugin classpath — before compiling a line — with
          # "Dependency requires at least JVM runtime version 21". Every run since
          # 2026-07-28 failed that way, on Main as well as on branches.
          #
          # The compiled output is unchanged: sourceCompatibility,
          # targetCompatibility and jvmTarget are all still 17, so the bytecode
          # and the minSdk 26 desugaring behaviour are exactly as before.
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licences & install platform 36
        run: |
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          "$SDK_MGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run Room migration and DAO tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.elmtrackr.app.data.local.ElmTrackrDatabaseMigrationTest,com.elmtrackr.app.data.local.dao.ShiftDaoTest,com.elmtrackr.app.data.local.dao.SettingsDaoTest,com.elmtrackr.app.data.local.dao.ProjectDaoTest --no-daemon

  release:
    name: Build release AAB
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # 21, not 17, and this is about the JVM Gradle runs on rather than what
          # the app compiles to. The Paparazzi 2.0.0-alpha05 Gradle plugin
          # publishes only a JVM 21 variant, so on 17 the build failed while
          # resolving the plugin classpath — before compiling a line — with
          # "Dependency requires at least JVM runtime version 21". Every run since
          # 2026-07-28 failed that way, on Main as well as on branches.
          #
          # The compiled output is unchanged: sourceCompatibility,
          # targetCompatibility and jvmTarget are all still 17, so the bytecode
          # and the minSdk 26 desugaring behaviour are exactly as before.
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licences & install platform 36
        run: |
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          "$SDK_MGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Write CI signing keystore to local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p android/keystore
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/keystore/ci-release.jks \
            -alias ci-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ci-release-pass \
            -keypass ci-release-pass \
            -dname "CN=ElmTrackr CI, OU=CI, O=ElmTrackr, L=Unknown, ST=Unknown, C=US"
          {
            [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] && \
              printf 'supabase.url=%s\nsupabase.anon.key=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY"
            printf 'KEYSTORE_PATH=keystore/ci-release.jks\n'
            printf 'KEYSTORE_PASSWORD=ci-release-pass\n'
            printf 'KEY_ALIAS=ci-release\n'
            printf 'KEY_PASSWORD=ci-release-pass\n'
          } > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Bundle release AAB (phone + watch)
        working-directory: android
        # The watch app is a separate same-package artifact, so it needs its own
        # bundle. Both are uploaded to the same Play listing; Play delivers the
        # watch bundle to a paired watch.
        run: ./gradlew :app:bundleRelease :wear:bundleRelease :app:lintVitalRelease --no-daemon --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          # CI-only signing — NOT for Play Store. Build bundleRelease locally with elmtrackr-release.jks.
          name: ElmTrackr-release-CI-ONLY-DO-NOT-UPLOAD-TO-PLAY
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/wear/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
