# Builds a debug APK from android/ and uploads it as a downloadable artifact.
# No secrets required. No emulator. No Play Store publishing.
# Triggered only when Android sources or this workflow file change.

name: Android CI

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  # Allow triggering a build manually from the Actions tab without a code push.
  workflow_dispatch:

jobs:
  build:
    name: Build & test debug APK
    runs-on: ubuntu-latest

    env:
      # Suppress the Gradle daemon in CI — each run is a fresh container.
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java ──────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Caches ~/.gradle/caches and ~/.gradle/wrapper keyed on
          # gradle-wrapper.properties + *.gradle.kts fingerprints.
          cache: gradle

      # ── Android SDK ───────────────────────────────────────────────────────
      # GitHub-hosted ubuntu-latest ships with the Android command-line tools
      # at $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.
      # We just need to accept licences and pull down platform-35.
      - name: Accept Android SDK licences & install platform 35
        run: |
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          "$SDK_MGR" "platforms;android-35" "build-tools;35.0.0"

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # ── Tests ─────────────────────────────────────────────────────────────
      # continue-on-error so a missing test source set doesn't fail the job.
      # Remove the flag once real unit tests are added.
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true

      # ── Artifact ──────────────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          # Download this from: Actions tab → select run → Artifacts section
          name: ElmTrackr-debug
          path: android/app/build/outputs/apk/debug/*.apk
          # Fail loudly if the APK was never produced.
          if-no-files-found: error
          retention-days: 30
